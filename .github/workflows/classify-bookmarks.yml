name: Classify Raindrop Bookmarks

on:
  schedule:
    # Run weekly on Sundays at 3:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger

# The run updates classifier-state.json (entity counts and bookmarks left in
# Unsorted). Without write access it would reset every week and entity tags
# would never reach their 2-bookmark threshold.
#
# The weekly tag cleanup was removed: topic tags now come from the fixed list
# in taxonomy.json, and its model-driven merges would fight that list.
permissions:
  contents: write

concurrency:
  group: classify-bookmarks
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

    - name: Run bookmark classification
      run: node classify.js
      env:
        RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Commit classifier state
      # Runs even if classification partly failed, so the entity counts from
      # the bookmarks that did succeed are kept.
      if: always()
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -- classifier-state.json 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "No classifier state changes to commit."
          exit 0
        fi

        git commit -m "chore: update classifier state [skip ci]"

        # The scheduled job is the only writer, but a manual dispatch can race
        # it; rebase rather than fail the run.
        for attempt in 1 2 3; do
          if git push; then
            echo "Pushed classifier state."
            exit 0
          fi
          echo "Push failed (attempt $attempt), rebasing…"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          sleep $((attempt * 5))
        done

        echo "::error::Could not push classifier state after 3 attempts."
        exit 1
